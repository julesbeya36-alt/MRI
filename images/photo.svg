    <line x1="210" y1="50" x2="210" y2="10" />
    <circle cx="210" cy="6" r="3" fill="#000" />
    <circle cx="340" cy="30" r="18" fill="#fff" stroke="#000" stroke-width="1" />
  </g>
  <text x="18" y="240" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000">Photo: dessin placeholder N/B</text>
</svg>