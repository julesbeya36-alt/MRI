<svg xmlns="http://www.w3.org/2000/svg" width="840" height="520" viewBox="0 0 420 260" role="img" aria-labelledby="phlbl">
  <title id="phlbl">Dessin N/B de l'église</title>
  <rect x="2" y="2" width="416" height="256" fill="#fff" stroke="#000" stroke-width="1" stroke-dasharray="3 4"/>
  <!-- esquisse simple d'une église -->
  <g stroke="#000" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="90" y="120" width="240" height="100" />
